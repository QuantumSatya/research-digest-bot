# Research Digest Bot – settings
# On the first run this file is copied to config.ini (which is git-ignored).
# Edit config.ini, not this file.

[paths]
# Where the weekly Report_<start>_to_<end>.pdf files (and the bot's memory, _state/) go.
output_dir = ~/ResearchDigest
keywords_file = keywords.txt
journals_file = journals.txt
# Delete or empty filters.txt to switch topic filtering off.
filters_file = filters.txt

[schedule]
# Day on which the weekly report is made (monday ... sunday).
# Schedule the bot to run DAILY; on other days it only collects journal-feed items.
report_weekday = monday
# On the very first run, report papers from this many days back.
first_run_lookback_days = 7
# Never report arXiv papers older than this, even after a long pause.
max_age_days = 21

[arxiv]
# Newest N results checked per keyword. Raise it for very broad keywords.
max_results_per_keyword = 300
# arXiv asks for at least 3 s between API calls. Values below 3 are raised to 3.
pause_seconds = 3.5
# Please put a way to reach you (e.g. your repo URL) – arXiv appreciates it.
user_agent = research-digest-bot/1.0 (+https://github.com/QuantumSatya/research-digest-bot)

[email]
# none      – no email (the PDF is still written)
# mail_app  – macOS only: sends through the Mail app (no password stored)
# smtp      – any provider; set the password in the DIGEST_SMTP_PASSWORD environment variable
method = none
to =
smtp_host = smtp.example.com
smtp_port = 587
smtp_user =
smtp_from =
# Attach the summary PDF (smtp only).
attach_pdf = yes
